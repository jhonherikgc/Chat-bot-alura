<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InteliBot</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="image/x-icon">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <div class="chat-wrapper">
    <h1 class="chat-title"><strong>👋 Bem-vindos ao InteliBot!</strong> <span id="auto-type"></span></h1>

    <div class="chat-history" id="historico">
      </div>

    <div class="chat-input-area">
      <textarea id="pergunta" name="pergunta" placeholder="Digite sua pergunta ao InteliBot 🤖..."></textarea>
      <select id="modelo" name="modelo">
        <option value="gemini-2.5-flash">Flash 2.5</option>
        <option value="gemini-2.5-pro">Pro 2.5</option>
      </select>
      <button id="enviar">Enviar</button>
    </div>
  </div>

  <script>
    const historicoDiv = document.getElementById('historico');
    const perguntaInput = document.getElementById('pergunta');
    const modeloSelect = document.getElementById('modelo');
    const enviarButton = document.getElementById('enviar');

    function formatarResposta(texto) {
      // 1. CORREÇÃO 2: Negrito com dois asteriscos (**)
      texto = texto.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
      
      // 2. Itálico com um asterisco (*)
      texto = texto.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
      
      // 3. Cabeçalhos (H3, H2, H1) - O Gemini frequentemente usa ###
      texto = texto.replace(/###\s*(.*)/g, '<h3>$1</h3>');
      texto = texto.replace(/##\s*(.*)/g, '<h2>$1</h2>');
      texto = texto.replace(/#\s*(.*)/g, '<h1>$1</h1>');
      
      // 4. Listas (assumindo que o Gemini usa * para listas não ordenadas)
      // Esta é uma implementação básica. Para listas complexas, o uso de uma biblioteca de parsing de Markdown seria melhor.
      texto = texto.replace(/^\*\s*(.*)$/gm, '<li>$1</li>');
      
      // 5. Bloco de Código (```) - Já estava correto
      texto = texto.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
        // Limpa possíveis tags HTML dentro do código para evitar injeção
        const safeCode = code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<pre><code class="language-${lang || 'plaintext'}">${hljs.highlightAuto(safeCode).value}</code></pre>`;
      });

      // 6. Código Inline (`) - Já estava correto
      texto = texto.replace(/`([^`\n]+)`/g, (match, inline) => `<code>${inline}</code>`);

      // 7. Quebras de Linha (transforma \n em <br> para melhor visualização)
      texto = texto.replace(/\n/g, '<br>');

      return texto;
    }

    function adicionarMensagem(mensagem) {
      const div = document.createElement('div');
      div.classList.add('mensagem');
      if (mensagem.remetente === 'user') {
        div.classList.add('mensagem-usuario');
        // Usamos textContent aqui para segurança e formatação simples
        div.textContent = `Você: ${mensagem.texto}`; 
      } else {
        div.classList.add('mensagem-bot');
        // Usamos innerHTML para renderizar as tags HTML geradas pela formatação Markdown
        div.innerHTML = `${formatarResposta(mensagem.texto)}`;
      }
      historicoDiv.appendChild(div);
      historicoDiv.scrollTop = historicoDiv.scrollHeight;
    }

    enviarButton.addEventListener('click', () => {
      const pergunta = perguntaInput.value.trim();
      const modelo = modeloSelect.value;
      if (!pergunta) return;

      adicionarMensagem({ remetente: 'user', texto: pergunta });
      perguntaInput.value = '';
      enviarButton.disabled = true;

      const formData = new FormData();
      formData.append('pergunta', pergunta);
      formData.append('modelo', modelo);

      fetch('/gerar_resposta', {
        method: 'POST',
        body: formData,
      })
        .then(response => response.json())
        .then(data => {
          enviarButton.disabled = false;
          if (data.erro) {
            // Se o servidor retornou uma chave 'erro', exibe a mensagem de erro
            adicionarMensagem({ remetente: 'gemini', texto: `Resposta: Erro no servidor: ${data.erro}` });
          } else {
            // Caso contrário, exibe a resposta normal
            adicionarMensagem({ remetente: 'gemini', texto: data.resposta || 'Sem resposta.' });
          }
        })
        .catch(error => {
          enviarButton.disabled = false;
          adicionarMensagem({ remetente: 'gemini', texto: `Erro de comunicação: ${error}` });
        });
    });
  </script>
  <script>
      const textos = [
    "Eu sou o seu assistente inteligente 🤖",
    "As soluções inteligentes para as suas dúvidas ⚛️.",
    "Onde Conecta você ao conhecimento 🧠."
  ];

  let i = 0;      
  let j = 0;      
  let apagando = false;
  const elemento = document.getElementById("auto-type");

  function loop() {
    const frase = textos[i];

    if (!apagando) {
      elemento.textContent = frase.substring(0, j + 1);
      j++;
      if (j === frase.length) {
        apagando = true;
        setTimeout(loop, 1500); 
        return;
      }
    } else {
      elemento.textContent = frase.substring(0, j - 1);
      j--;
      if (j === 0) {
        apagando = false;
        i = (i + 1) % textos.length;
      }
    }

    setTimeout(loop, apagando ? 50 : 100);
  }

  loop();
  </script>

</body>
</html>
